spring.application.name=precificamos-api
# Puerto: Render (y otros PaaS) lo inyectan en la variable PORT.
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/precificamos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Orígenes permitidos por CORS (separados por coma, admite comodines).
app.cors.origenes=${FRONTEND_URL:http://localhost:4200}
# Autenticación con JWT. En producción JWT_SECRET es obligatorio (mínimo 32 caracteres);
# el valor por defecto solo sirve para desarrollo local.
app.jwt.secreto=${JWT_SECRET:solo-para-desarrollo-local-cambiar-en-produccion-0123456789}
# Duración del token en horas (por defecto 7 días).
app.jwt.horas-expiracion=${JWT_HORAS_EXPIRACION:168}
