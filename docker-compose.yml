services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: precificamos
    ports: ["3306:3306"]
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/precificamos?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: root
      FRONTEND_URL: http://localhost:4200
      # Solo para uso local; en producción usá un secreto propio de al menos 32 caracteres.
      JWT_SECRET: secreto-local-de-docker-compose-cambiar-en-produccion
    ports: ["8080:8080"]
    depends_on: [db]
