# Blueprint de Render para la API (opcional: también se puede crear el servicio a mano).
# La base MySQL es externa (Render no ofrece MySQL administrado): completá las variables en el panel.
services:
  - type: web
    name: precificamos-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/segmentos
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Secreto para firmar los JWT: Render genera un valor al azar al crear el servicio con el Blueprint.
      # Si el servicio ya existe y se creó a mano, agregá JWT_SECRET en el panel (mínimo 32 caracteres).
      - key: JWT_SECRET
        generateValue: true
